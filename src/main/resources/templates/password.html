<!DOCTYPE html>
<html lang="fa" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تغییر رمز عبور | پیگیر</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.rtl.min.css}">
  <link rel="stylesheet" th:href="@{/css/bootstrap-icons.min.css}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="auth">
  <form class="auth-card" th:action="@{/password}" method="post">
    <div class="logo"><i class="bi bi-key"></i></div>
    <h1 class="h4 fw-bold mb-1">تغییر رمز عبور</h1>
    <p class="text-secondary small mb-4">رمز جدید باید حداقل ۶ نویسه باشد.</p>
    <div class="flash err" th:if="${error}"><i class="bi bi-exclamation-octagon"></i><span th:text="${error}"></span></div>
    <div class="mb-3"><label class="form-label">رمز فعلی</label>
      <input class="form-control ltr" name="current" type="password" autocomplete="current-password" required></div>
    <div class="mb-3"><label class="form-label">رمز جدید</label>
      <input class="form-control ltr" name="password" type="password" autocomplete="new-password" minlength="6" required></div>
    <div class="mb-4"><label class="form-label">تکرار رمز جدید</label>
      <input class="form-control ltr" name="confirm" type="password" autocomplete="new-password" minlength="6" required></div>
    <button class="btn btn-ac w-100 py-2" type="submit">ذخیره رمز جدید</button>
    <a class="d-block text-center mt-3 small" th:href="@{/}">بازگشت</a>
  </form>
</div>
</body>
</html>
