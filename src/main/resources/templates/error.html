<!DOCTYPE html>
<html lang="fa" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>خطا | پیگیر</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.rtl.min.css}">
  <link rel="stylesheet" th:href="@{/css/bootstrap-icons.min.css}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="auth">
  <div class="auth-card text-center">
    <div class="logo mx-auto"><i class="bi bi-exclamation-triangle"></i></div>
    <h1 class="h4 fw-bold" th:text="${status == 403} ? 'دسترسی ندارید' : (${status == 404} ? 'صفحه پیدا نشد' : 'خطایی رخ داد')">خطا</h1>
    <p class="text-secondary small" th:text="${status == 403} ? 'این کار برای حساب شما مجاز نیست. اگر باید مجاز باشد، صفحه را دوباره باز کنید (ممکن است نشست یا فرم قدیمی باشد) یا با ادمین تماس بگیرید.' : (${status == 404} ? 'گزارش یا صفحه‌ی موردنظر وجود ندارد یا اجازه‌ی دیدنش را ندارید.' : 'لطفاً دوباره تلاش کنید.')"></p>
    <a class="btn btn-ac" th:href="@{/}">بازگشت به صفحه‌ی اصلی</a>
  </div>
</div>
</body>
</html>
