spring.application.name=peygir
server.port=${PEYGIR_HTTPS_PORT:8443}
server.address=127.0.0.1
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Local HTTPS: the application creates its own certificate on first startup.
# A configured server.ssl.key-store takes precedence over local generation.
server.ssl.enabled=true
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2
server.forward-headers-strategy=none
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
peygir.https.auto-generate=${PEYGIR_HTTPS_AUTO_GENERATE:true}
peygir.https.directory=${PEYGIR_HTTPS_DIRECTORY:./data/tls}
peygir.http-port=${PEYGIR_HTTP_PORT:8080}

# --- Database (MVP: H2 file mode; data survives restarts, stored in ./data) ---
spring.datasource.url=jdbc:h2:file:./data/peygir
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Flyway picks the folder by DB vendor: db/migration/h2, db/migration/oracle, db/migration/postgresql ...
spring.flyway.locations=classpath:db/migration/{vendor}

spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=5MB

# --- Peygir ---
# Load demo teams/users/reports on first run (only when the DB has no users)
peygir.seed-demo=true
# Dashboard auto-refresh interval (seconds)
peygir.dashboard-refresh-seconds=15
